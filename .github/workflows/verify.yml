name: Verify
on:
  # Kept manual while release acceptance is local; do not run on pushes/PRs.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: make check
      - run: make webapp
      - run: cargo build -p aegis-runtime-core --bin aegis_runtime_access --example remote_access_harness
      - run: cd webapp && npx playwright install --with-deps chromium
      - run: python3 scripts/test_remote_access.py
      - run: node webapp/scripts/test-remote-access.mjs
      - run: python3 scripts/test_access_lifecycle.py
      - run: python3 scripts/privacy-audit.py
  windows-installer-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test_windows_install.ps1
        shell: pwsh
